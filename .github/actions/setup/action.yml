name: Setup Toolchain
description: Install Rust, Node, and pnpm with caching

inputs:
  rust:
    description: Install Rust toolchain
    default: 'true'
  node:
    description: Install Node, pnpm, and dependencies
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Rust
      if: inputs.rust == 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@v2

    - name: Install pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@v4

    - name: Setup Node
      if: inputs.node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
